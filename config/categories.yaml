# =============================================================================
# US Local Business Lead Generation — Category Library
# =============================================================================
# Each industry group contains categories.
# Each category has:
#   - display_name: Human-readable name for reports
#   - search_terms: List of natural-language queries used on Google Maps
#
# The scraper will search each term + location combination.
# Example: "dental clinic in Houston, Texas"
# =============================================================================

